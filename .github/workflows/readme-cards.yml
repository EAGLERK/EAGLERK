name: Render README cards

on:
  schedule:
    - cron: "17 1 * * *"   # 06:47 IST every day
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "fonts/**", "data/portrait.txt", ".github/workflows/readme-cards.yml"]

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch commit activity
        run: python scripts/fetch_activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Render README cards
        run: python scripts/render_readme_cards.py
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/activity.json cards
          git diff --cached --quiet || { git commit -m "Refresh README cards"; git push; }
